[package]
name = "spawn-render-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

# Standalone fuzz workspace excluded from the root workspace so headless stable
# CI (`scripts/check.sh`) does not require nightly sanitizer flags.
[workspace]

[dependencies]
arbitrary = { version = "1.5.0", default-features = false }
libfuzzer-sys = { version = "0.4.13", default-features = true }
spawn-render = { path = "..", default-features = false }

[[bin]]
name = "decode_cooked_shader"
path = "fuzz_targets/decode_cooked_shader.rs"
test = false
doc = false
bench = false
