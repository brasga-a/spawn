[package]
name = "spawn-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# No backend by default: presentation policy, depth/allocator logic, mesh packing,
# cooked-shader validation, and public types compile and test without a GPU.
default = []
# Vulkan backend (ADR-0004). The Vulkan loader is loaded at runtime, so building
# needs no system libraries and a missing loader is a startup error.
vulkan = ["dep:ash", "dep:bytemuck", "dep:raw-window-handle"]

[dependencies]
ash = { workspace = true, optional = true, features = ["loaded", "std"] }
bytemuck = { workspace = true, optional = true, features = ["derive"] }
raw-window-handle = { workspace = true, optional = true }
spawn-math = { version = "0.1.0", path = "../spawn-math", default-features = false }

[dev-dependencies]
arbitrary = { workspace = true }
insta = { workspace = true }
proptest = { workspace = true, features = ["std"] }
