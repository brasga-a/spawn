# CI (ADR-0007): runs on pull requests and on manual dispatch only.
name: CI

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  linux:
    name: Linux (fmt, clippy, test, doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup on the runner installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
      # Native backends are off by default (ADR-0002); they dlopen their system
      # libraries, so the runner needs no extra packages.
      - run: cargo clippy -p spawn-platform --features wayland --all-targets -- -D warnings
      - run: cargo test -p spawn-platform --features wayland
      - run: cargo doc -p spawn-platform --features wayland --no-deps
      # The Vulkan loader is loaded at runtime; GPU tests are #[ignore] (no GPU).
      - run: cargo clippy -p spawn-render --features vulkan --all-targets -- -D warnings
      - run: cargo test -p spawn-render --features vulkan
      - run: cargo doc -p spawn-render --features vulkan --no-deps

  windows:
    name: Windows (check, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo check --workspace --all-targets
      - run: cargo check -p spawn-render --features vulkan --all-targets
      - run: cargo test --workspace

  deny:
    name: Licenses and advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Gate G2 coverage-guided fuzzing of the untrusted cooked-shader parser.
  # Owner-approved ADR-0007 exception: nightly is used ONLY in this job, only for
  # the standalone fuzz package; it never builds, lints or tests the engine.
  fuzz:
    name: Fuzz (nightly cargo-fuzz + ASan, cooked-shader parser)
    runs-on: ubuntu-latest
    env:
      FUZZ_SECONDS: 300
    defaults:
      run:
        working-directory: crates/spawn-render/fuzz
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      # Seeds are generated, never committed (SPN-INV-084).
      - name: Generate seed corpus
        run: cargo +nightly run --example seed_corpus -- corpus/decode_cooked_shader
      - name: Fuzz decode_cooked_shader
        run: >
          cargo +nightly fuzz run --sanitizer address decode_cooked_shader
          corpus/decode_cooked_shader --
          -max_total_time=${FUZZ_SECONDS} -rss_limit_mb=2048 -max_len=65536
          -print_final_stats=1
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/spawn-render/fuzz/artifacts
      - name: Licenses and advisories (fuzz package)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/spawn-render/fuzz/Cargo.toml
