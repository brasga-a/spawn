# cargo-deny configuration (ADR-0008). Approved crates: docs/DEPENDENCIES.md.

[graph]
all-features = true

[advisories]
# RustSec advisories fail the check; unmaintained crates are reported.
yanked = "deny"

[licenses]
# Allowed in shipped code. MPL-2.0 needs owner approval (add per crate in [[licenses.exceptions]]).
# Royalty-free proprietary SDKs are isolated in integration crates and listed as exceptions by their ADR.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9
# The allowlist is policy, not a list of licenses currently in use.
unused-allowed-license = "allow"

# libFuzzer (LLVM) is NCSA-licensed: permissive (ADR-0008), test-only, and linked
# solely into the standalone Gate G2 fuzz workspace `crates/spawn-render/fuzz`.
[[licenses.exceptions]]
crate = "libfuzzer-sys"
allow = ["NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
