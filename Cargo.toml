[workspace]
resolver = "3"
members = [".", "crates/*", "tools/*"]
exclude = ["crates/spawn-render/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"

# Third-party crates (docs/DEPENDENCIES.md), pinned here and opted into per crate.
[workspace.dependencies]
arbitrary = { version = "1.5.0", default-features = false }
ash = { version = "0.38.0", default-features = false }
bytemuck = { version = "1.25.2", default-features = false }
clap = { version = "4.6.8", default-features = false }
glam = { version = "0.34.3", default-features = false }
insta = { version = "1.49.0", default-features = false }
libm = { version = "0.2.16", default-features = false }
proptest = { version = "1.12.0", default-features = false }
raw-window-handle = { version = "0.6.2", default-features = false }
rspirv = { version = "0.13.0", default-features = false }
rustix = { version = "1.1.6", default-features = false }
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols = { version = "0.32.13", default-features = false }

# Lints (ADR-0007), inherited by every package through `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Build profiles (ADR-0007): games are unusable at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package]
name = "spawn-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
spawn-core = { version = "0.1.0", path = "crates/spawn-core", default-features = false }
spawn-input = { version = "0.1.0", path = "crates/spawn-input", default-features = false }
spawn-platform = { version = "0.1.0", path = "crates/spawn-platform", default-features = false }
spawn-render = { version = "0.1.0", path = "crates/spawn-render", default-features = false }

# Native Linux runtime backends (Wayland + Vulkan 1.3). Kept target-conditional
# so workspace checks and headless verification tests on targets without a
# native backend yet (Windows CI) compile without Linux system libraries.
# The composition root is the only package that depends on both spawn-platform
# and spawn-render (SPN-INV-005, SPN-INV-006).
[target.'cfg(target_os = "linux")'.dependencies]
spawn-platform = { version = "0.1.0", path = "crates/spawn-platform", default-features = false, features = ["wayland"] }
spawn-render = { version = "0.1.0", path = "crates/spawn-render", default-features = false, features = ["vulkan"] }

[[example]]
name = "vulkan_clear"
path = "examples/vulkan_clear.rs"

[[example]]
name = "vulkan_triangle"
path = "examples/vulkan_triangle.rs"
