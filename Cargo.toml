[workspace]
resolver = "3"
members = [".", "crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99.1"

# Third-party crates (docs/DEPENDENCIES.md), pinned here and opted into per crate.
[workspace.dependencies]
ash = { version = "0.38.0", default-features = false }
raw-window-handle = { version = "0.6.2", default-features = false }
rustix = { version = "1.1.6", default-features = false }
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols = { version = "0.32.13", default-features = false }

# Lints (ADR-0007), inherited by every package through `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Build profiles (ADR-0007): games are unusable at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[package]
name = "spawn-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]

# Manual smoke examples. The composition root is the only package that may
# depend on both spawn-platform and spawn-render (SPN-INV-005, SPN-INV-006);
# dev-dependencies keep them out of the `spawn-engine` binary itself.
[target.'cfg(target_os = "linux")'.dev-dependencies]
spawn-platform = { path = "crates/spawn-platform", features = ["wayland"] }
spawn-render = { path = "crates/spawn-render", features = ["vulkan"] }

[[example]]
name = "vulkan_clear"
path = "examples/vulkan_clear.rs"
